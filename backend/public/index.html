<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Deathswatch</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1115; color: #f2f3f5;
      padding-top: env(safe-area-inset-top);
      min-height: 100vh;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: #0f1115f2; backdrop-filter: blur(10px);
      padding: 14px 16px calc(10px);
      border-bottom: 1px solid #2a2d35;
    }
    h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.2px; }
    #status { font-size: 12px; color: #8a8f98; margin-top: 2px; }
    main { padding: 12px; padding-bottom: env(safe-area-inset-bottom); }
    .card {
      background: #171a21; border: 1px solid #2a2d35; border-radius: 12px;
      padding: 14px; margin-bottom: 10px;
    }
    .card:active { background: #1d212b; }
    .card-head { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .source {
      color: #e05555; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .age { color: #8a8f98; font-size: 11px; }
    .title { font-size: 16px; font-weight: 600; line-height: 1.3; }
    .desc { color: #a9aeb8; font-size: 13px; line-height: 1.4; margin-top: 6px;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .spinner {
      width: 28px; height: 28px; margin: 40px auto;
      border: 3px solid #2a2d35; border-top-color: #e05555;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty, .error {
      text-align: center; color: #8a8f98; padding: 40px 24px; line-height: 1.5;
    }
    .error { color: #e05555; }
    a { color: inherit; text-decoration: none; display: block; }
  </style>
</head>
<body>
  <header>
    <h1>Deathswatch</h1>
    <div id="status">Chargement…</div>
  </header>
  <main id="list"><div class="spinner"></div></main>

  <script>
    var REFRESH_MS = 20000;
    function formatAge(iso) {
      var diff = Date.now() - new Date(iso).getTime();
      var m = Math.floor(diff / 60000);
      if (m < 1) return "à l'instant";
      if (m < 60) return "il y a " + m + " min";
      var h = Math.floor(m / 60);
      if (h < 24) return "il y a " + h + " h";
      return "il y a " + Math.floor(h / 24) + " j";
    }
    function esc(s) {
      return (s || "").replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function render(items) {
      var el = document.getElementById("list");
      var st = document.getElementById("status");
      if (!items.length) {
        el.innerHTML = '<div class="empty">Aucune annonce détectée pour le moment.<br>Le serveur scrute la presse en continu.</div>';
      } else {
        el.innerHTML = items.map(function (it) {
          return '<a href="' + esc(it.link) + '" target="_blank" rel="noopener">' +
            '<div class="card">' +
            '<div class="card-head"><span class="source">' + esc(it.source) + '</span>' +
            '<span class="age">' + formatAge(it.publishedAt) + "</span></div>" +
            '<div class="title">' + esc(it.title) + "</div>" +
            (it.description ? '<div class="desc">' + esc(it.description) + "</div>" : "") +
            "</div></a>";
        }).join("");
      }
      st.textContent = "Actualisé à " + new Date().toLocaleTimeString("fr-FR") + " · " + items.length + " annonce(s)";
    }
    async function refresh() {
      try {
        var r = await fetch("/api/deaths?limit=100", { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        var data = await r.json();
        render(data.items);
      } catch (e) {
        document.getElementById("list").innerHTML =
          '<div class="error">Impossible de joindre le serveur<br><small>' + esc(e.message) + "</small></div>";
      }
    }
    refresh();
    setInterval(refresh, REFRESH_MS);
  </script>
</body>
</html>
