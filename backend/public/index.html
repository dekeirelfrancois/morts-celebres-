<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Deathswatch</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1115; color: #f2f3f5;
      padding-top: env(safe-area-inset-top);
      min-height: 100vh;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: #0f1115f2; backdrop-filter: blur(10px);
      padding: 14px 16px calc(10px);
      border-bottom: 1px solid #2a2d35;
    }
    h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.2px; }
    #status { font-size: 12px; color: #8a8f98; margin-top: 2px; }
    main { padding: 12px; padding-bottom: env(safe-area-inset-bottom); }
    .card {
      background: #171a21; border: 1px solid #2a2d35; border-radius: 12px;
      padding: 14px; margin-bottom: 10px;
    }
    .card:active { background: #1d212b; }
    .card-head { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .source {
      color: #e05555; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .age { color: #8a8f98; font-size: 11px; }
    .title { font-size: 16px; font-weight: 600; line-height: 1.3; }
    .desc { color: #a9aeb8; font-size: 13px; line-height: 1.4; margin-top: 6px;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .spinner {
      width: 28px; height: 28px; margin: 40px auto;
      border: 3px solid #2a2d35; border-top-color: #e05555;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty, .error {
      text-align: center; color: #8a8f98; padding: 40px 24px; line-height: 1.5;
    }
    .error { color: #e05555; }
    a { color: inherit; text-decoration: none; display: block; }
    #pushBar {
      display: none; align-items: center; justify-content: space-between;
      padding: 10px 12px 0;
    }
    #pushHint { font-size: 12px; color: #8a8f98; }
    #pushBtn {
      background: #e05555; color: #fff; border: 0; border-radius: 20px;
      padding: 10px 16px; font-size: 14px; font-weight: 600;
      font-family: inherit;
    }
    #pushBtn:active { opacity: 0.85; }
    #pushBtn.ok { background: #2f855a; }
    #pushBadge {
      display: none; font-size: 12px; color: #68d391; padding: 10px 16px 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Deathswatch</h1>
    <div id="status">Chargement…</div>
  </header>
  <div id="pushBar">
    <span id="pushHint">Soyez alerté dès qu'une annonce tombe</span>
    <button id="pushBtn">🔔 Activer</button>
  </div>
  <div id="pushBadge">🔔 Notifications activées</div>
  <main id="list"><div class="spinner"></div></main>

  <script>
    var REFRESH_MS = 20000;
    function formatAge(iso) {
      var diff = Date.now() - new Date(iso).getTime();
      var m = Math.floor(diff / 60000);
      if (m < 1) return "à l'instant";
      if (m < 60) return "il y a " + m + " min";
      var h = Math.floor(m / 60);
      if (h < 24) return "il y a " + h + " h";
      return "il y a " + Math.floor(h / 24) + " j";
    }
    function esc(s) {
      return (s || "").replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function render(items) {
      var el = document.getElementById("list");
      var st = document.getElementById("status");
      if (!items.length) {
        el.innerHTML = '<div class="empty">Aucune annonce détectée pour le moment.<br>Le serveur scrute la presse en continu.</div>';
      } else {
        el.innerHTML = items.map(function (it) {
          return '<a href="' + esc(it.link) + '" target="_blank" rel="noopener">' +
            '<div class="card">' +
            '<div class="card-head"><span class="source">' + esc(it.source) + '</span>' +
            '<span class="age">' + formatAge(it.publishedAt) + "</span></div>" +
            '<div class="title">' + esc(it.title) + "</div>" +
            (it.description ? '<div class="desc">' + esc(it.description) + "</div>" : "") +
            "</div></a>";
        }).join("");
      }
      st.textContent = "Actualisé à " + new Date().toLocaleTimeString("fr-FR") + " · " + items.length + " annonce(s)";
    }
    async function refresh() {
      try {
        var r = await fetch("/api/deaths?limit=100", { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        var data = await r.json();
        render(data.items);
      } catch (e) {
        document.getElementById("list").innerHTML =
          '<div class="error">Impossible de joindre le serveur<br><small>' + esc(e.message) + "</small></div>";
      }
    }
    refresh();
    setInterval(refresh, REFRESH_MS);

    // ————— Notifications push —————
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    var isStandalone =
      window.navigator.standalone === true ||
      window.matchMedia("(display-mode: standalone)").matches;
    var pushSupported =
      "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

    function urlBase64ToUint8Array(base64String) {
      var padding = "=".repeat((4 - (base64String.length % 4)) % 4);
      var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
      var rawData = atob(base64);
      var outputArray = new Uint8Array(rawData.length);
      for (var i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
      return outputArray;
    }

    function setPushState(state) {
      var bar = document.getElementById("pushBar");
      var badge = document.getElementById("pushBadge");
      var btn = document.getElementById("pushBtn");
      var hint = document.getElementById("pushHint");
      if (state === "on") {
        bar.style.display = "none";
        badge.style.display = "block";
      } else {
        badge.style.display = "none";
        bar.style.display = "flex";
        if (state === "need-pwa") {
          hint.textContent = "Notifications : ajoutez d'abord l'app à l'écran d'accueil";
          btn.style.display = "none";
        } else if (state === "unsupported") {
          bar.style.display = "none";
        } else if (state === "server-off") {
          bar.style.display = "none";
        }
      }
    }

    async function subscribeToPush() {
      try {
        var reg = await navigator.serviceWorker.register("/sw.js");
        var perm = Notification.permission;
        if (perm === "default") perm = await Notification.requestPermission();
        if (perm !== "granted") return;

        var keyRes = await fetch("/api/push-key", { cache: "no-store" });
        if (!keyRes.ok) return setPushState("server-off");
        var keyJson = await keyRes.json();

        var existing = await reg.pushManager.getSubscription();
        var sub =
          existing ||
          (await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(keyJson.publicKey),
          }));

        var r = await fetch("/api/subscribe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(sub),
        });
        if (r.ok) setPushState("on");
      } catch (e) {
        console.warn("push error", e);
      }
    }

    if (pushSupported) {
      if (isIOS && !isStandalone) {
        setPushState("need-pwa");
      } else if (Notification.permission === "granted") {
        subscribeToPush();
      } else {
        setPushState("off");
        document.getElementById("pushBtn").addEventListener("click", subscribeToPush);
      }
    } else {
      setPushState("unsupported");
    }
  </script>
</body>
</html>
